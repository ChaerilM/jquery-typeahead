name: Update npm Dependencies

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update npm dependencies
        run: npm update

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Create dependency update pull request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: update npm dependencies"
          title: "chore: update npm dependencies"
          body: |
            Automated npm dependency update.

            This PR was created after running:
            - npm update
            - npm test
            - npm run build
          branch: chore/npm-dependency-update
          delete-branch: true
